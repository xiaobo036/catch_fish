<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#02121f">
<meta name="format-detection" content="telephone=no">
<title>捕鱼达人</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* 安全区（刘海屏 / 底部横条） */
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);

    /* 响应式尺寸 */
    --fs-hud:  clamp(13px, min(3.8vw, 3.2vh), 16px);
    --size-btn: clamp(30px, min(9vw, 10vh), 42px);
    --pad-pill: clamp(6px, 1.6vw, 9px) clamp(10px, 3vw, 16px);
    --gap-hud: clamp(6px, 1.8vw, 10px);
    --edge:    clamp(10px, 3vw, 18px);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #02121f;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  #game {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
    cursor: none;
    z-index: 0;
  }

  /* ================= HUD ================= */
  .hud {
    position: fixed;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: var(--gap-hud);
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }

  #hudTopLeft {
    top: calc(var(--edge) + var(--sat));
    left: calc(var(--edge) + var(--sal));
  }
  #hudTopRight {
    top: calc(var(--edge) + var(--sat));
    right: calc(var(--edge) + var(--sar));
  }
  #hudBottom {
    bottom: calc(var(--edge) + var(--sab));
    left: calc(var(--edge) + var(--sal));
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: var(--pad-pill);
    border-radius: 999px;
    background: rgba(3, 26, 44, 0.62);
    border: 1px solid rgba(90, 200, 255, 0.3);
    color: #dff2ff;
    font-size: var(--fs-hud);
    font-weight: 600;
    letter-spacing: .4px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 3px 14px rgba(0,0,0,.45), inset 0 0 14px rgba(70,180,255,.1);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .pill .ico {
    font-size: calc(var(--fs-hud) - 1px);
    filter: drop-shadow(0 0 4px rgba(120,220,255,.6));
  }
  .pill.level {
    justify-content: center;
    min-width: 3.6em;
    padding-left: 8px;
    padding-right: 8px;
  }

  .btn {
    width: var(--size-btn);
    height: var(--size-btn);
    flex: 0 0 auto;
    border-radius: 50%;
    border: 1px solid rgba(90, 200, 255, 0.4);
    background: rgba(6, 34, 56, 0.75);
    color: #bfe8ff;
    font-size: calc(var(--size-btn) * 0.5);
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: transform .1s, background .15s, border-color .15s, opacity .15s;
    box-shadow: 0 3px 12px rgba(0,0,0,.4);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .btn:hover  { border-color: rgba(140, 225, 255, .85); }
  .btn:active { transform: scale(.9); background: rgba(20, 80, 130, .9); }
  .btn:disabled { opacity: .28; cursor: default; }
  .btn.icon { font-size: calc(var(--size-btn) * 0.46); }

  /* ================= 设置遮罩 ================= */
  #settingsOverlay {
    position: fixed;
    inset: 0;
    z-index: 35;
    background: rgba(0, 8, 16, 0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  #settingsOverlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  @media (min-width: 701px) {
    #settingsOverlay { display: none; }
  }

  /* ================= 设置面板 ================= */
  #settingsPanel {
    position: fixed;
    z-index: 40;
    top: calc(58px + var(--sat));
    right: calc(var(--edge) + var(--sar));
    width: 280px;
    padding: 16px;
    border-radius: 18px;
    background: rgba(4, 26, 44, 0.94);
    border: 1px solid rgba(90, 200, 255, 0.3);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 12px 44px rgba(0,0,0,.65), inset 0 0 26px rgba(60,170,255,.06);
    transform-origin: top right;
    opacity: 0;
    transform: scale(.94) translateY(-10px);
    pointer-events: none;
    transition: opacity .18s ease, transform .2s ease;
  }
  #settingsPanel.open {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(90, 200, 255, 0.16);
  }
  .panel-head span {
    color: #dff2ff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .panel-close {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid rgba(90, 200, 255, 0.3);
    background: rgba(10, 40, 66, 0.8);
    color: #bfe8ff;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .panel-close:hover,
  .panel-close:active {
    border-color: rgba(140, 225, 255, .85);
    background: rgba(20, 80, 130, .9);
  }

  .opt-group { margin-bottom: 14px; }
  .opt-label {
    color: #8fc7e8;
    font-size: 12px;
    letter-spacing: 1px;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .opt-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .opt-btns button {
    flex: 1 1 0;
    min-width: 52px;
    min-height: 42px;
    padding: 8px 4px;
    border-radius: 10px;
    border: 1px solid rgba(90, 200, 255, 0.26);
    background: rgba(10, 40, 66, 0.8);
    color: #bfe8ff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .opt-btns button:hover  { border-color: rgba(140, 225, 255, .7); }
  .opt-btns button:active { transform: scale(.96); }
  .opt-btns button.active {
    background: linear-gradient(180deg, rgba(60,170,255,.55), rgba(18,88,150,.85));
    border-color: rgba(150, 230, 255, .95);
    color: #fff;
    box-shadow: 0 0 14px rgba(70,180,255,.45);
  }
  .opt-desc {
    margin-top: 7px;
    color: #6ea7c9;
    font-size: 11.5px;
    letter-spacing: .3px;
    line-height: 1.5;
  }

  .restart-btn {
    width: 100%;
    min-height: 46px;
    padding: 11px;
    border-radius: 11px;
    cursor: pointer;
    border: 1px solid rgba(255, 140, 120, 0.45);
    background: linear-gradient(180deg, rgba(255,110,90,.22), rgba(150,40,30,.35));
    color: #ffd9d0;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 1px;
    transition: all .15s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .restart-btn:hover  { border-color: rgba(255,170,150,.9); background: linear-gradient(180deg, rgba(255,110,90,.35), rgba(170,45,35,.5)); }
  .restart-btn:active { transform: scale(.98); }

  /* ================= Toast ================= */
  #toast {
    position: fixed;
    left: 50%;
    top: calc(20% + var(--sat));
    transform: translate(-50%, 0) scale(.96);
    z-index: 20;
    pointer-events: none;
    padding: clamp(9px, 2.4vw, 12px) clamp(16px, 5vw, 26px);
    border-radius: 999px;
    background: rgba(3, 26, 44, .8);
    border: 1px solid rgba(90, 200, 255, .35);
    color: #dff2ff;
    font-size: clamp(12.5px, 3.5vw, 15px);
    letter-spacing: .5px;
    text-align: center;
    line-height: 1.5;
    max-width: 88vw;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
    opacity: 0;
    transition: opacity .5s ease, transform .5s ease;
  }
  #toast.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }

  /* ================= 移动端：底部抽屉式设置面板 ================= */
  @media (max-width: 700px) {
    #settingsPanel {
      top: auto;
      bottom: 0;
      left: 0;
      right: 0;
      width: auto;
      max-height: 84vh;
      max-height: 84dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 22px 22px 0 0;
      border-left: none;
      border-right: none;
      border-bottom: none;
      padding: 18px clamp(16px, 5vw, 24px) calc(18px + var(--sab));
      transform: translateY(102%);
      transform-origin: bottom center;
      opacity: 1;
      box-shadow: 0 -12px 48px rgba(0,0,0,.7);
    }
    #settingsPanel.open {
      transform: translateY(0);
      opacity: 1;
    }
    .panel-head { margin-bottom: 16px; }
    .panel-head span { font-size: 16px; }
    .opt-label { font-size: 13px; margin-bottom: 10px; }
    .opt-btns { gap: 8px; }
    .opt-btns button { min-height: 48px; font-size: 14.5px; }
    .opt-desc { font-size: 12.5px; margin-top: 9px; }
    .opt-group { margin-bottom: 18px; }
  }

  /* ================= 小屏横屏：压缩 HUD ================= */
  @media (max-height: 420px) and (orientation: landscape) {
    :root {
      --edge: 8px;
    }
    .pill {
      padding: 5px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    #hudTopRight .btn.icon { font-size: 15px; }
    #settingsPanel {
      max-height: 92vh;
      max-height: 92dvh;
    }
  }

  /* 触屏设备隐藏准星的鼠标指针 */
  @media (hover: none) and (pointer: coarse) {
    #game { cursor: default; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud" id="hudTopLeft">
  <div class="pill"><span class="ico">🪙</span><span id="coinsEl">1000</span></div>
</div>

<div class="hud" id="hudTopRight">
  <div class="pill"><span class="ico">🏆</span><span id="scoreEl">0</span></div>
  <button class="btn icon" id="muteBtn" title="音效开关" aria-label="音效开关">🔊</button>
  <button class="btn icon" id="settingsBtn" title="游戏设置" aria-label="游戏设置">⚙️</button>
</div>

<div class="hud" id="hudBottom">
  <button class="btn" id="lvDown" title="降低炮台等级" aria-label="降低炮台等级">−</button>
  <div class="pill level"><span id="lvText">Lv.1</span></div>
  <button class="btn" id="lvUp" title="提升炮台等级" aria-label="提升炮台等级">+</button>
</div>

<div id="settingsOverlay"></div>

<div id="settingsPanel" role="dialog" aria-label="游戏设置">
  <div class="panel-head">
    <span>游戏设置</span>
    <button class="panel-close" id="panelClose" aria-label="关闭设置">×</button>
  </div>

  <div class="opt-group">
    <div class="opt-label">游戏难度</div>
    <div class="opt-btns" id="diffBtns">
      <button data-diff="easy">简单</button>
      <button data-diff="normal" class="active">普通</button>
      <button data-diff="hard">困难</button>
    </div>
    <div class="opt-desc" id="diffDesc">捕获率 ×1.00 · 起始 1000 金币</div>
  </div>

  <div class="opt-group">
    <div class="opt-label">鱼群游动速度</div>
    <div class="opt-btns" id="speedBtns">
      <button data-speed="0.7">慢速</button>
      <button data-speed="1" class="active">普通</button>
      <button data-speed="1.4">快速</button>
      <button data-speed="1.8">极速</button>
    </div>
    <div class="opt-desc" id="speedDesc">当前速度倍率 ×1.0</div>
  </div>

  <button class="restart-btn" id="restartBtn">重新开始</button>
</div>

<div id="toast">按住屏幕发射渔网 · 按 1~5 切换炮台等级</div>

<script>
(() => {
'use strict';

/* ============================================================
 *  0. DOM & 基础工具
 * ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const coinsEl = document.getElementById('coinsEl');
const scoreEl = document.getElementById('scoreEl');
const lvText  = document.getElementById('lvText');
const lvDown  = document.getElementById('lvDown');
const lvUp    = document.getElementById('lvUp');
const muteBtn = document.getElementById('muteBtn');
const toastEl = document.getElementById('toast');

const settingsBtn     = document.getElementById('settingsBtn');
const settingsPanel   = document.getElementById('settingsPanel');
const settingsOverlay = document.getElementById('settingsOverlay');
const panelClose      = document.getElementById('panelClose');
const diffBtns        = document.getElementById('diffBtns');
const speedBtns       = document.getElementById('speedBtns');
const diffDesc        = document.getElementById('diffDesc');
const speedDesc       = document.getElementById('speedDesc');
const restartBtn      = document.getElementById('restartBtn');

const rand  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const isTouchDevice = ('ontouchstart' in window) ||
                      (navigator.maxTouchPoints > 0);

function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ============================================================
 *  1. 画布尺寸 & 响应式缩放
 * ============================================================ */
let W = 0, H = 0;
let canvasRect = { left: 0, top: 0 };

function computeScales() {
  // 炮台 / 鱼群视觉尺寸：同时受宽高约束，横屏时自动缩小
  state.cannonScale = clamp(Math.min(W / 480, H / 680), 0.58, 1.15);
  state.fishScale   = clamp(Math.min(W / 520, H / 760), 0.60, 1.00);

  // 游动速度按屏幕宽度归一化，保证不同尺寸下"穿屏时间"接近一致
  state.speedScale  = clamp(W / 1000, 0.38, 1.60);

  // 粒子数量系数（小屏减少，省性能）
  state.fxMul = clamp((W * H) / 700000, 0.45, 1.15);
}

function updateCanvasRect() {
  const r = canvas.getBoundingClientRect();
  canvasRect.left = r.left;
  canvasRect.top  = r.top;
}

function resize() {
  const oldW = W, oldH = H;

  const cw = canvas.clientWidth;
  const ch = canvas.clientHeight;
  W = cw > 0 ? cw : (window.innerWidth  || 360);
  H = ch > 0 ? ch : (window.innerHeight || 640);

  // DPR 自适应：像素量过大时降采样，保证移动端流畅
  const rawDpr = window.devicePixelRatio || 1;
  const capDpr = (W * H) > 1000000 ? 1.5 : 2;
  const dpr = Math.min(rawDpr, capDpr);

  canvas.width  = Math.max(1, Math.round(W * dpr));
  canvas.height = Math.max(1, Math.round(H * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  computeScales();
  updateCanvasRect();

  // 气泡迁移
  if (state.bubbles.length === 0) {
    initBubbles();
  } else if (oldW > 0 && oldH > 0) {
    const rx = W / oldW, ry = H / oldH;
    for (const b of state.bubbles) { b.x *= rx; b.y *= ry; }
  }

  // 鱼群位置迁移（旋转屏幕时保持相对位置）
  if (oldW > 0 && oldH > 0) {
    const rx = W / oldW, ry = H / oldH;
    for (const f of state.fishes) {
      f.x *= rx;
      f.baseY *= ry;
      f.baseY = clamp(f.baseY, H * 0.06, H * 0.80);
    }
  }

  // 鼠标初始位置
  if (!state.pointerInside) {
    state.mouse.x = W / 2;
    state.mouse.y = H * 0.4;
  }
}

let resizeRAF = 0;
function scheduleResize() {
  if (resizeRAF) cancelAnimationFrame(resizeRAF);
  resizeRAF = requestAnimationFrame(() => {
    resizeRAF = 0;
    resize();
  });
}

/* ============================================================
 *  2. 配置：鱼种 / 难度
 * ============================================================ */
const FISH_TYPES = [
  { name: '小丑鱼', score: 2,  radius: 22, speed: [72, 122], prob: 0.42,
    color: '#ff9f45', color2: '#ff7a1a', tail: '#ff6b00', deco: 'stripe' },
  { name: '蓝刀鱼', score: 5,  radius: 30, speed: [56, 96],  prob: 0.26,
    color: '#4fb8ff', color2: '#1e7fd4', tail: '#1c6cb8', deco: 'none' },
  { name: '紫纹鱼', score: 10, radius: 38, speed: [46, 82],  prob: 0.16,
    color: '#b06bff', color2: '#7a35d6', tail: '#6a28c0', deco: 'dot' },
  { name: '金枪鱼', score: 20, radius: 50, speed: [40, 72],  prob: 0.11,
    color: '#ffd93b', color2: '#e0a800', tail: '#c89000', deco: 'stripe' },
  { name: '深海鲨', score: 50, radius: 72, speed: [28, 52],  prob: 0.05,
    color: '#8fa3b8', color2: '#5b7186', tail: '#4a5f73', deco: 'none' },
];

const DIFFICULTY = {
  easy:   { name: '简单', catchMul: 1.35, startCoins: 2000,
            desc: '捕获率 ×1.35 · 起始 2000 金币' },
  normal: { name: '普通', catchMul: 1.00, startCoins: 1000,
            desc: '捕获率 ×1.00 · 起始 1000 金币' },
  hard:   { name: '困难', catchMul: 0.62, startCoins: 600,
            desc: '捕获率 ×0.62 · 起始 600 金币' },
};

const CATCH_BASE = { 2: 0.72, 5: 0.52, 10: 0.34, 20: 0.18, 50: 0.06 };

function catchChance(score, level) {
  const base = CATCH_BASE[score] || 0.3;
  return Math.min(0.95, base * (0.82 + level * 0.18) * state.catchMul);
}

const LEVEL_COLORS = ['#4fc3ff', '#4dffb0', '#ffe066', '#ff9f45', '#ff5a6e'];
const levelColor = l => LEVEL_COLORS[l - 1];

/* ============================================================
 *  3. 游戏状态
 * ============================================================ */
const state = {
  coins: DIFFICULTY.normal.startCoins,
  score: 0,
  level: 1,
  maxLevel: 5,

  diff: 'normal',
  catchMul: DIFFICULTY.normal.catchMul,
  speedMult: 1.0,

  // 响应式缩放系数（resize 时更新）
  cannonScale: 1,
  fishScale: 1,
  speedScale: 1,
  fxMul: 1,

  fishes: [],
  bullets: [],
  nets: [],
  popups: [],
  sparks: [],
  bubbles: [],

  time: 0,
  spawnTimer: 0.4,
  brokeTimer: 3,

  aim: -Math.PI / 2,
  mouse: { x: 0, y: 0 },
  pointerInside: false,
  pointerType: 'mouse',
  firing: false,
  fireCooldown: 0,

  shake: 0,
  muted: false,
};

function cannonPos() {
  return { x: W / 2, y: H - 8 * state.cannonScale };
}

/* ============================================================
 *  4. 音效
 * ============================================================ */
let audioCtx = null;

function initAudio() {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (_) { /* ignore */ }
}

function beep(freq, dur, type, gain, slideTo) {
  if (state.muted || !audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(gain || 0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  } catch (_) { /* ignore */ }
}

const sfx = {
  shoot:  () => beep(680, 0.09, 'square',   0.035, 220),
  hit:    () => beep(920, 0.07, 'triangle', 0.045),
  catch:  () => { beep(880, 0.10, 'triangle', 0.07); setTimeout(() => beep(1320, 0.14, 'triangle', 0.06), 70); },
  bigWin: () => { beep(660, 0.10, 'sine', 0.08); setTimeout(() => beep(990, 0.10, 'sine', 0.08), 80);
                  setTimeout(() => beep(1320, 0.22, 'sine', 0.08), 160); },
  deny:   () => beep(160, 0.16, 'sawtooth', 0.05, 90),
  ui:     () => beep(560, 0.06, 'sine', 0.04, 820),
};

/* ============================================================
 *  5. 实体生成 & 特效
 * ============================================================ */
function initBubbles() {
  state.bubbles = [];
  const n = Math.round((W * H) / 42000) + 10;
  for (let i = 0; i < n; i++) {
    state.bubbles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: rand(1.4, 4.4),
      v: rand(10, 42),
      sway: Math.random() * Math.PI * 2,
      swaySpeed: rand(0.8, 2.0),
    });
  }
}

function spawnFish() {
  // 概率抽签
  const r = Math.random();
  let acc = 0, type = FISH_TYPES[0];
  for (const t of FISH_TYPES) {
    acc += t.prob;
    if (r <= acc) { type = t; break; }
  }

  // 限制大鱼的屏幕占比
  const bigCount = state.fishes.filter(f => f.type.score >= 20).length;
  if (bigCount >= 3 && type.score >= 20) type = FISH_TYPES[0];

  const dir = Math.random() < 0.5 ? 1 : -1;
  const visualR = type.radius * state.fishScale;

  const topY = H * 0.09;
  const bottomY = Math.max(
    topY + 24,
    Math.min(H * 0.72, H - visualR * 2 - 88)
  );
  const baseY = rand(topY, bottomY);

  const speed = rand(type.speed[0], type.speed[1]);

  state.fishes.push({
    type,
    dir,
    x: dir > 0 ? -visualR * 3 : W + visualR * 3,
    y: baseY,
    baseY,
    vxBase: speed * dir,          // 基础像素速度
    phase: Math.random() * Math.PI * 2,
    wagSpeed: rand(6, 11) * (type.radius < 30 ? 1.25 : 0.85),
    waveSpeed: rand(0.6, 1.6),
    wavePhase: Math.random() * Math.PI * 2,
    waveAmp: rand(5, 16),
  });
}

function addPopup(x, y, text, color) {
  state.popups.push({ x, y, text, color, life: 1.05, maxLife: 1.05 });
}

function addNet(x, y, r) {
  state.nets.push({ x, y, r, life: 0.55, maxLife: 0.55 });
}

function addSparks(x, y, color, n, power) {
  power = power || 1;
  const count = Math.max(3, Math.round(n * state.fxMul));
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(50, 200) * power;
    state.sparks.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: rand(0.32, 0.7),
      maxLife: 0.7,
      color,
      r: rand(1.0, 3.0),
    });
  }
}

function addSplash(x, y) {
  const count = Math.max(3, Math.round(6 * state.fxMul));
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(40, 110);
    state.sparks.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: rand(0.18, 0.4),
      maxLife: 0.4,
      color: '#bfe8ff',
      r: rand(0.8, 1.9),
    });
  }
}

/* ============================================================
 *  6. 射击与命中
 * ============================================================ */
function tryShoot() {
  const cost = state.level * 10;
  if (state.coins < cost) {
    sfx.deny();
    addPopup(W / 2, H * 0.72, '金币不足', '#ff7a8a');
    return;
  }
  state.coins -= cost;
  updateHUD();

  const { x: cx, y: cy } = cannonPos();
  const a = state.aim;
  const L = 78 * state.cannonScale;
  const bx = cx + Math.cos(a) * L;
  const by = cy + Math.sin(a) * L;
  const speed = 1050;

  state.bullets.push({
    x: bx, y: by,
    vx: Math.cos(a) * speed,
    vy: Math.sin(a) * speed,
    level: state.level,
    life: 2.4,
  });

  addSparks(bx, by, levelColor(state.level), 5, 0.6);
  sfx.shoot();
}

function resolveHit(fish, bullet, index) {
  const chance = catchChance(fish.type.score, bullet.level);

  if (Math.random() < chance) {
    // —— 捕获成功 ——
    state.fishes.splice(index, 1);

    const gain = fish.type.score * 10;
    state.coins += gain;
    state.score += fish.type.score;

    const fr = fish.type.radius * state.fishScale;

    addPopup(fish.x, fish.y, '+' + gain, '#ffe066');
    addNet(fish.x, fish.y, fr * 1.35);
    addSparks(fish.x, fish.y, fish.type.color, 16, 1.2);

    if (fish.type.score >= 20) {
      state.shake = Math.min(14, 5 + fish.type.score * 0.18);
      sfx.bigWin();
    } else {
      sfx.catch();
    }
    updateHUD();
  } else {
    // —— 未捕获 ——
    addSplash(bullet.x, bullet.y);
    sfx.hit();
  }
}

/* ============================================================
 *  7. 逻辑更新
 * ============================================================ */
function update(dt) {
  state.time += dt;

  // ---- 生成鱼 ----
  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    spawnFish();
    // 速度倍率越高，刷新略快；speedScale 越小（小屏），刷新间隔越长以控制数量
    const rate = 1 / Math.sqrt(Math.max(0.5, state.speedMult));
    const base = rand(0.45, 1.15) * rate / Math.max(0.4, state.speedScale);
    state.spawnTimer = clamp(base, 0.25, 3.2);
  }

  // ---- 鱼群移动 ----
  const wagMul = 0.5 + state.speedMult * 0.5;
  const vScale = state.speedScale * state.speedMult;

  for (const f of state.fishes) {
    f.x += f.vxBase * vScale * dt;
    f.phase += f.wagSpeed * wagMul * dt;
    f.y = f.baseY + Math.sin(state.time * f.waveSpeed + f.wavePhase)
                   * f.waveAmp * state.fishScale;
  }

  const margin = 3.2;
  state.fishes = state.fishes.filter(f => {
    const r = f.type.radius * state.fishScale;
    if (f.dir > 0 && f.x > W + r * margin) return false;
    if (f.dir < 0 && f.x < -r * margin) return false;
    return true;
  });

  // ---- 连发 ----
  if (state.firing) {
    state.fireCooldown -= dt;
    if (state.fireCooldown <= 0) {
      tryShoot();
      state.fireCooldown = 0.28;
    }
  }

  // ---- 子弹 & 碰撞 ----
  for (let i = state.bullets.length - 1; i >= 0; i--) {
    const b = state.bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;

    let hit = false;
    for (let j = state.fishes.length - 1; j >= 0; j--) {
      const f = state.fishes[j];
      const fr = f.type.radius * state.fishScale;
      const dx = b.x - f.x;
      const dy = b.y - f.y;
      const rr = fr * 0.85 + 6;
      if (dx * dx + dy * dy <= rr * rr) {
        hit = true;
        resolveHit(f, b, j);
        break;
      }
    }

    if (hit || b.life <= 0 ||
        b.x < -60 || b.x > W + 60 || b.y < -60 || b.y > H + 60) {
      state.bullets.splice(i, 1);
    }
  }

  // ---- 特效生命周期 ----
  for (let i = state.nets.length - 1; i >= 0; i--) {
    state.nets[i].life -= dt;
    if (state.nets[i].life <= 0) state.nets.splice(i, 1);
  }
  for (let i = state.popups.length - 1; i >= 0; i--) {
    state.popups[i].life -= dt;
    if (state.popups[i].life <= 0) state.popups.splice(i, 1);
  }
  for (let i = state.sparks.length - 1; i >= 0; i--) {
    const s = state.sparks[i];
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vx *= 0.94;
    s.vy = s.vy * 0.94 + 90 * dt;
    s.life -= dt;
    if (s.life <= 0) state.sparks.splice(i, 1);
  }

  // ---- 气泡 ----
  for (const b of state.bubbles) {
    b.y -= b.v * dt;
    b.sway += b.swaySpeed * dt;
    if (b.y < -12) {
      b.y = H + 12;
      b.x = Math.random() * W;
    }
  }

  // ---- 震动衰减 ----
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 32);

  // ---- 破产保护 ----
  if (state.coins < 10) {
    state.brokeTimer -= dt;
    if (state.brokeTimer <= 0) {
      state.coins += 100;
      state.brokeTimer = 4;
      addPopup(W / 2, H * 0.45, '系统补给 +100', '#7fffd4');
      updateHUD();
    }
  } else {
    state.brokeTimer = 3;
  }
}

/* ============================================================
 *  8. 绘制
 * ============================================================ */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0,    '#0a3a5c');
  g.addColorStop(0.45, '#062a44');
  g.addColorStop(1,    '#02121f');
  ctx.fillStyle = g;
  ctx.fillRect(-60, -60, W + 120, H + 120);

  // 水下光柱
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++) {
    const x = W * (i + 0.5) / 4 + Math.sin(state.time * 0.28 + i * 1.7) * (W * 0.07);
    const w = (W * 0.09) + i * (W * 0.035);
    const grad = ctx.createLinearGradient(x - w, 0, x + w, H);
    grad.addColorStop(0, 'rgba(120, 220, 255, 0.085)');
    grad.addColorStop(1, 'rgba(120, 220, 255, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x - w * 0.22, -40);
    ctx.lineTo(x + w * 0.22, -40);
    ctx.lineTo(x + w * 0.95, H + 40);
    ctx.lineTo(x - w * 0.95, H + 40);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawBubbles() {
  ctx.save();
  ctx.strokeStyle = 'rgba(190, 235, 255, 0.35)';
  ctx.lineWidth = 1;
  for (const b of state.bubbles) {
    const x = b.x + Math.sin(b.sway) * 7;
    ctx.beginPath();
    ctx.arc(x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(190, 235, 255, 0.07)';
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x - b.r * 0.32, b.y - b.r * 0.32, b.r * 0.28, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fill();
  }
  ctx.restore();
}

function drawFish(f) {
  const r = f.type.radius * state.fishScale;
  const t = f.type;
  const wag = Math.sin(f.phase) * 0.55;

  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.scale(f.dir, 1);
  ctx.rotate(Math.sin(f.phase) * 0.055);

  // 尾鳍
  ctx.beginPath();
  ctx.moveTo(-r * 0.92, 0);
  ctx.quadraticCurveTo(-r * 1.5, -r * 0.5 + wag * r * 0.30, -r * 1.95, -r * 0.80 + wag * r * 0.62);
  ctx.quadraticCurveTo(-r * 1.42, 0,                        -r * 1.95,  r * 0.80 + wag * r * 0.62);
  ctx.quadraticCurveTo(-r * 1.5,  r * 0.5 + wag * r * 0.30, -r * 0.92, 0);
  ctx.closePath();
  ctx.fillStyle = t.tail;
  ctx.fill();

  // 背鳍
  ctx.beginPath();
  ctx.moveTo(-r * 0.35, -r * 0.52);
  ctx.quadraticCurveTo(r * 0.05, -r * 1.05, r * 0.42, -r * 0.5);
  ctx.closePath();
  ctx.fillStyle = t.tail;
  ctx.globalAlpha = 0.85;
  ctx.fill();
  ctx.globalAlpha = 1;

  // 腹鳍
  ctx.beginPath();
  ctx.moveTo(-r * 0.25, r * 0.48);
  ctx.quadraticCurveTo(r * 0.02, r * 0.88, r * 0.30, r * 0.46);
  ctx.closePath();
  ctx.fillStyle = t.tail;
  ctx.globalAlpha = 0.7;
  ctx.fill();
  ctx.globalAlpha = 1;

  // 身体
  const bg = ctx.createLinearGradient(0, -r * 0.62, 0, r * 0.62);
  bg.addColorStop(0,    t.color2);
  bg.addColorStop(0.42, t.color);
  bg.addColorStop(1,    t.color2);
  ctx.beginPath();
  ctx.ellipse(0, 0, r, r * 0.60, 0, 0, Math.PI * 2);
  ctx.fillStyle = bg;
  ctx.fill();

  // 纹饰
  if (t.deco !== 'none') {
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, 0, r, r * 0.60, 0, 0, Math.PI * 2);
    ctx.clip();

    if (t.deco === 'stripe') {
      ctx.fillStyle = 'rgba(255,255,255,0.42)';
      for (let i = -1; i <= 1; i++) {
        const px = i * r * 0.52;
        ctx.beginPath();
        ctx.ellipse(px, 0, r * 0.10, r * 0.62, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (t.deco === 'dot') {
      ctx.fillStyle = 'rgba(255,255,255,0.34)';
      for (let i = 0; i < 5; i++) {
        const px = -r * 0.5 + i * r * 0.32;
        const py = (i % 2 === 0 ? -1 : 1) * r * 0.20;
        ctx.beginPath();
        ctx.arc(px, py, r * 0.075, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // 高光
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, 0, r, r * 0.60, 0, 0, Math.PI * 2);
  ctx.clip();
  const hl = ctx.createLinearGradient(0, -r * 0.6, 0, r * 0.1);
  hl.addColorStop(0, 'rgba(255,255,255,0.32)');
  hl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl;
  ctx.fillRect(-r, -r * 0.6, r * 2, r * 0.7);
  ctx.restore();

  // 眼睛
  ctx.beginPath();
  ctx.arc(r * 0.56, -r * 0.14, r * 0.155, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(r * 0.60, -r * 0.14, r * 0.078, 0, Math.PI * 2);
  ctx.fillStyle = '#10202e';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(r * 0.63, -r * 0.19, r * 0.028, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();

  ctx.restore();
}

function drawBullet(b) {
  const c = levelColor(b.level);
  const rad = 4.6 + b.level * 0.7;

  ctx.save();
  ctx.shadowColor = c;
  ctx.shadowBlur = 16;
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.arc(b.x, b.y, rad, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(b.x, b.y, rad * 0.45, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawNet(n) {
  const p = 1 - n.life / n.maxLife;
  const r = n.r * (0.35 + p * 1.0);
  const alpha = 1 - p;

  ctx.save();
  ctx.translate(n.x, n.y);
  ctx.globalAlpha = alpha;

  ctx.strokeStyle = 'rgba(185, 242, 255, 0.95)';
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.stroke();

  ctx.save();
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.clip();
  ctx.strokeStyle = 'rgba(140, 220, 255, 0.5)';
  ctx.lineWidth = 1;
  const step = r / 4;
  for (let i = -4; i <= 4; i++) {
    const off = i * step;
    const h = Math.sqrt(Math.max(0, r * r - off * off));
    ctx.beginPath(); ctx.moveTo(off, -h); ctx.lineTo(off, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-h, off); ctx.lineTo(h, off); ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
}

function drawSparks() {
  ctx.save();
  for (const s of state.sparks) {
    const a = Math.max(0, s.life / s.maxLife);
    ctx.globalAlpha = a;
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawPopups() {
  const fs = Math.round(clamp(H * 0.028, 16, 22));
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${fs}px system-ui, -apple-system, sans-serif`;
  for (const p of state.popups) {
    const t = p.life / p.maxLife;
    ctx.globalAlpha = Math.min(1, t * 2.0);
    ctx.fillStyle = p.color;
    ctx.shadowColor = 'rgba(0,0,0,0.65)';
    ctx.shadowBlur = 8;
    ctx.fillText(p.text, p.x, p.y - (1 - t) * 62);
  }
  ctx.restore();
}

function drawCannon() {
  const s = state.cannonScale;
  const { x: cx, y: cy } = cannonPos();
  const a = state.aim;
  const col = levelColor(state.level);
  const L = 78 * s;
  const baseR = 42 * s;

  ctx.save();
  ctx.translate(cx, cy);

  // 底部光晕
  const haloR = 110 * s;
  const halo = ctx.createRadialGradient(0, 0, 6 * s, 0, 0, haloR);
  halo.addColorStop(0, 'rgba(80, 200, 255, 0.22)');
  halo.addColorStop(1, 'rgba(80, 200, 255, 0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(0, 0, haloR, 0, Math.PI * 2);
  ctx.fill();

  // 炮管
  ctx.save();
  ctx.rotate(a);

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  roundRect(ctx, -4 * s, -8 * s, L + 12 * s, 16 * s, 8 * s);
  ctx.fill();

  const g = ctx.createLinearGradient(0, -11 * s, 0, 11 * s);
  g.addColorStop(0,    '#e8f6ff');
  g.addColorStop(0.35, '#8fb9d8');
  g.addColorStop(1,    '#2f4f6b');
  ctx.fillStyle = g;
  roundRect(ctx, -8 * s, -9.5 * s, L + 8 * s, 19 * s, 9.5 * s);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(L - 2 * s, 0, 12 * s, 0, Math.PI * 2);
  ctx.fillStyle = col;
  ctx.shadowColor = col;
  ctx.shadowBlur = 18;
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 2 * s;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(L - 2 * s, 0, 5.5 * s, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fill();

  ctx.restore();

  // 底座
  ctx.beginPath();
  ctx.arc(0, 0, baseR, Math.PI, Math.PI * 2);
  ctx.closePath();
  const bg = ctx.createLinearGradient(0, -baseR, 0, 0);
  bg.addColorStop(0, '#2e5474');
  bg.addColorStop(1, '#0b1c2b');
  ctx.fillStyle = bg;
  ctx.fill();

  ctx.strokeStyle = 'rgba(95, 195, 255, 0.55)';
  ctx.lineWidth = 2 * s;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0, 0, baseR * 0.67, Math.PI, Math.PI * 2);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(95, 195, 255, 0.25)';
  ctx.lineWidth = 1.5 * s;
  ctx.stroke();

  // 等级数字
  ctx.fillStyle = col;
  ctx.font = `bold ${Math.round(19 * s)}px system-ui, -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = col;
  ctx.shadowBlur = 10;
  ctx.fillText(String(state.level), 0, -15 * s);
  ctx.shadowBlur = 0;

  ctx.restore();
}

function drawCrosshair() {
  if (!state.pointerInside) return;

  const x = state.mouse.x;
  const y = state.mouse.y;
  const col = levelColor(state.level);
  const s = clamp(state.cannonScale, 0.7, 1.15);
  const R = 13 * s;

  ctx.save();
  ctx.strokeStyle = col;
  ctx.globalAlpha = 0.85;
  ctx.lineWidth = 1.6 * s;

  ctx.beginPath();
  ctx.arc(x, y, R, 0, Math.PI * 2);
  ctx.stroke();

  ctx.globalAlpha = 0.55;
  ctx.beginPath();
  ctx.moveTo(x - R * 1.6, y); ctx.lineTo(x - R * 0.55, y);
  ctx.moveTo(x + R * 0.55, y); ctx.lineTo(x + R * 1.6, y);
  ctx.moveTo(x, y - R * 1.6); ctx.lineTo(x, y - R * 0.55);
  ctx.moveTo(x, y + R * 0.55); ctx.lineTo(x, y + R * 1.6);
  ctx.stroke();

  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  ctx.arc(x, y, 1.8 * s, 0, Math.PI * 2);
  ctx.fillStyle = col;
  ctx.fill();
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  if (state.shake > 0.3) {
    ctx.translate((Math.random() - 0.5) * state.shake,
                  (Math.random() - 0.5) * state.shake);
  }

  drawBackground();
  drawBubbles();

  for (const f of state.fishes)  drawFish(f);
  for (const n of state.nets)    drawNet(n);
  for (const b of state.bullets) drawBullet(b);

  drawSparks();
  drawPopups();
  drawCannon();

  ctx.restore();

  drawCrosshair();
}

/* ============================================================
 *  9. HUD
 * ============================================================ */
let lastCoins = -1, lastScore = -1, lastLevel = -1;

function updateHUD() {
  if (state.coins !== lastCoins) { coinsEl.textContent = state.coins; lastCoins = state.coins; }
  if (state.score !== lastScore) { scoreEl.textContent = state.score; lastScore = state.score; }
  if (state.level !== lastLevel) {
    lvText.textContent = 'Lv.' + state.level;
    lvText.style.color = levelColor(state.level);
    lastLevel = state.level;
  }
  lvDown.disabled = state.level <= 1;
  lvUp.disabled   = state.level >= state.maxLevel;
}

/* ============================================================
 *  10. Toast
 * ============================================================ */
let toastTimer = null;
function showToast(msg, ms) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 2600);
}

/* ============================================================
 *  11. 设置面板
 * ============================================================ */
const isNarrow = () => window.matchMedia('(max-width: 700px)').matches;

function openPanel() {
  settingsPanel.classList.add('open');
  if (isNarrow()) settingsOverlay.classList.add('show');
  stopFiring();
}

function closePanel() {
  settingsPanel.classList.remove('open');
  settingsOverlay.classList.remove('show');
}

settingsBtn.addEventListener('click', e => {
  e.stopPropagation();
  initAudio(); sfx.ui();
  if (settingsPanel.classList.contains('open')) closePanel();
  else openPanel();
});

panelClose.addEventListener('click', () => { sfx.ui(); closePanel(); });
settingsOverlay.addEventListener('click', () => closePanel());

// 点击面板外部关闭（宽屏）
document.addEventListener('pointerdown', e => {
  if (!settingsPanel.classList.contains('open')) return;
  if (settingsPanel.contains(e.target)) return;
  if (settingsBtn.contains(e.target)) return;
  closePanel();
}, true);

// ESC 关闭
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && settingsPanel.classList.contains('open')) closePanel();
});

// ---- 难度切换 ----
diffBtns.addEventListener('click', e => {
  const btn = e.target.closest('button[data-diff]');
  if (!btn) return;
  initAudio(); sfx.ui();

  state.diff = btn.dataset.diff;
  state.catchMul = DIFFICULTY[state.diff].catchMul;

  [...diffBtns.children].forEach(b => b.classList.toggle('active', b === btn));
  diffDesc.textContent = DIFFICULTY[state.diff].desc;
  showToast('难度：' + DIFFICULTY[state.diff].name + ' · 立即生效');
});

// ---- 鱼速切换 ----
speedBtns.addEventListener('click', e => {
  const btn = e.target.closest('button[data-speed]');
  if (!btn) return;
  initAudio(); sfx.ui();

  state.speedMult = parseFloat(btn.dataset.speed);
  [...speedBtns.children].forEach(b => b.classList.toggle('active', b === btn));
  speedDesc.textContent = '当前速度倍率 ×' + state.speedMult.toFixed(1);
  showToast('鱼群速度 ×' + state.speedMult.toFixed(1));
});

// ---- 重新开始 ----
restartBtn.addEventListener('click', () => {
  initAudio(); sfx.ui();
  restartGame();
  closePanel();
});

function restartGame() {
  const d = DIFFICULTY[state.diff];

  state.coins = d.startCoins;
  state.score = 0;
  state.level = 1;

  state.fishes = [];
  state.bullets = [];
  state.nets = [];
  state.popups = [];
  state.sparks = [];

  state.spawnTimer = 0.4;
  state.brokeTimer = 3;
  state.shake = 0;
  stopFiring();

  updateHUD();

  for (let i = 0; i < 4; i++) spawnFish();
  for (const f of state.fishes) {
    const r = f.type.radius * state.fishScale;
    f.x = rand(r, W - r);
  }

  showToast('已重新开始 · ' + d.name + ' · 鱼速 ×' + state.speedMult.toFixed(1));
}

/* ============================================================
 *  12. 输入（鼠标 / 触摸 / 多指）
 * ============================================================ */
let activePointerId = null;

// 触摸时准星向上偏移，避免手指遮挡目标
function touchAimOffset() {
  return 46 * clamp(state.cannonScale, 0.6, 1.15);
}

function setAim(clientX, clientY, isTouch) {
  let mx = clientX - canvasRect.left;
  let my = clientY - canvasRect.top;

  if (isTouch) {
    my -= touchAimOffset();
  }

  // 限制在画布范围内（触摸偏移后可能越界）
  mx = clamp(mx, -40, W + 40);
  my = clamp(my, -40, H + 40);

  state.mouse.x = mx;
  state.mouse.y = my;

  const { x: cx, y: cy } = cannonPos();
  let a = Math.atan2(my - cy, mx - cx);

  // 限制在上半圆
  if (a > 0) {
    a = (mx >= cx) ? -0.10 : -(Math.PI - 0.10);
  }
  state.aim = clamp(a, -Math.PI + 0.10, -0.10);
}

function stopFiring() {
  state.firing = false;
  activePointerId = null;
}

canvas.addEventListener('pointerdown', e => {
  if (activePointerId !== null) return;      // 忽略第二根手指
  if (settingsPanel.classList.contains('open')) return;

  e.preventDefault();
  initAudio();

  activePointerId = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

  state.pointerInside = true;
  state.pointerType = e.pointerType || 'mouse';

  setAim(e.clientX, e.clientY, state.pointerType === 'touch');

  state.firing = true;
  state.fireCooldown = 0.28;
  tryShoot();
}, { passive: false });

canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== activePointerId && activePointerId !== null) return;

  state.pointerType = e.pointerType || state.pointerType;
  state.pointerInside = true;
  setAim(e.clientX, e.clientY, state.pointerType === 'touch');
}, { passive: true });

window.addEventListener('pointerup', e => {
  if (e.pointerId !== activePointerId) return;
  activePointerId = null;
  state.firing = false;
});

window.addEventListener('pointercancel', e => {
  if (e.pointerId !== activePointerId) return;
  activePointerId = null;
  state.firing = false;
});

canvas.addEventListener('pointerleave', () => {
  if (state.pointerType === 'mouse') state.pointerInside = false;
});

// 鼠标场景下离开画布时隐藏准星
document.addEventListener('mouseleave', () => { state.pointerInside = false; });

// ---- 键盘 ----
window.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '5') {
    state.level = +e.key;
    updateHUD();
  } else if (e.key === '+' || e.key === '=') {
    state.level = Math.min(state.maxLevel, state.level + 1); updateHUD();
  } else if (e.key === '-' || e.key === '_') {
    state.level = Math.max(1, state.level - 1); updateHUD();
  } else if (e.key === 'm' || e.key === 'M') {
    toggleMute();
  }
});

// ---- 音效 / 等级按钮 ----
function toggleMute() {
  state.muted = !state.muted;
  muteBtn.textContent = state.muted ? '🔇' : '🔊';
  muteBtn.style.opacity = state.muted ? '0.55' : '1';
}

muteBtn.addEventListener('click', () => { initAudio(); toggleMute(); });

function changeLevel(delta) {
  const next = clamp(state.level + delta, 1, state.maxLevel);
  if (next === state.level) return;
  state.level = next;
  updateHUD();
}

lvDown.addEventListener('click', () => { initAudio(); changeLevel(-1); });
lvUp.addEventListener('click', () => { initAudio(); changeLevel(1); });

/* ============================================================
 *  13. 主循环
 * ============================================================ */
let last = performance.now();

function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;   // 切后台回来防跳帧
  if (dt < 0) dt = 0;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) last = performance.now();
});

/* ============================================================
 *  14. 启动
 * ============================================================ */
resize();

// 尺寸变化：窗口、旋转、地址栏收起、软键盘
window.addEventListener('resize', scheduleResize);
window.addEventListener('orientationchange', () => {
  setTimeout(scheduleResize, 120);
  setTimeout(scheduleResize, 360);
});
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', scheduleResize);
  window.visualViewport.addEventListener('scroll', scheduleResize);
}

// 预热鱼群
for (let i = 0; i < 4; i++) spawnFish();
for (const f of state.fishes) {
  const r = f.type.radius * state.fishScale;
  f.x = rand(r, W - r);
}

state.mouse.x = W / 2;
state.mouse.y = H * 0.42;

// 同步面板文案
diffDesc.textContent  = DIFFICULTY[state.diff].desc;
speedDesc.textContent = '当前速度倍率 ×' + state.speedMult.toFixed(1);

updateHUD();

showToast(isTouchDevice
  ? '按住屏幕发射渔网 · 手指上方即为瞄准点'
  : '按住屏幕发射渔网 · 1~5 切换炮台等级', 3600);

requestAnimationFrame(loop);

})();
</script>
</body>
